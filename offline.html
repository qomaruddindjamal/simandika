<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JIBAS — Luring</title>
<style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f7f9fc; color: #16202b;
    }
    @media (prefers-color-scheme: dark) { body { background: #0e1319; color: #e6edf4; } }
    .card { max-width: 30rem; text-align: center; }
    .glyph { font-size: 3rem; }
    h1 { font-size: 1.35rem; margin: .75rem 0 .35rem; }
    p { margin: 0 0 1.25rem; opacity: .8; line-height: 1.55; }
    button {
        font: inherit; padding: .55rem 1.1rem; border-radius: .5rem; border: 0; cursor: pointer;
        background: #0f6fb8; color: #fff;
    }
    button.secondary { background: transparent; color: inherit; border: 1px solid currentColor; margin-left: .5rem; }
    small { display: block; margin-top: 1.5rem; opacity: .55; }
</style>
</head>
<body>
<div class="card">
    <div class="glyph" aria-hidden="true">&#9672;</div>
    <h1>JIBAS tidak dapat terhubung</h1>
    <p>Perangkat sedang luring atau server tidak merespons. Data yang tersimpan di aplikasi tetap bisa dibuka setelah koneksi pulih.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
    <button type="button" class="secondary" onclick="history.back()">Kembali</button>
    <small>Halaman luring JIBAS &mdash; Sistem Informasi Yayasan</small>
</div>
</body>
</html>
