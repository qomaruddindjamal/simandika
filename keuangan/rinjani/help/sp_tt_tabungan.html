<p class="help-content">
    Tabungan yang dijadikan sumber dana untuk pembayaran non tunai. Setiap transaksi non tunai yang dilakukan oleh siswa/pegawai akan mengambil saldo dari tabungan ini.
    <br><br>
    <b>CATATAN:</b> Mohon perhatikan tabungan yang digunakan. Bila sudah digunakan dalam transaksi, tabungan ini tidak dapat diubah.
</p>
